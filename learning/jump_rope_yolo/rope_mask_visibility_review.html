<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>完整绳子与遮挡标注</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#141820;color:#e8edf6;font:15px/1.6 system-ui,sans-serif}header{padding:16px 22px;background:#202735}h1{font-size:22px;margin:0 0 6px}p{margin:5px 0}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 20px;background:#252e3d}button,select,input,textarea{font:inherit}button,select{padding:6px 10px;background:#34435a;color:white;border:1px solid #5e7290;border-radius:5px}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}label{white-space:nowrap}#viewport{overflow:auto;height:64vh;padding:10px;background:#0d1016}canvas{display:block;touch-action:none;cursor:crosshair;image-rendering:pixelated}footer{padding:12px 20px}textarea{width:min(900px,100%);height:58px;background:#202735;color:white;border:1px solid #65738b;padding:6px}#status{color:#a8d9ff}#meta{font-size:13px;color:#b4c3d9}.red{color:#ff7676}.orange{color:#ffbf69}.yellow{color:#f8df6e}.magenta{color:#ef9fff}kbd{background:#394355;padding:0 4px}a{color:#9fcaff}
</style>
<header><h1>完整绳子掩膜 · 遮挡属性</h1><p>先用可调宽度画笔把完整绳子补画好，再切换“标记遮挡”沿隐藏段涂过。红色表示可见部分，绿色表示推断的遮挡部分；两者共用同一张完整绳子掩膜，标记遮挡不会改变形状或宽度。</p><p>已载入你之前的可见标注。橙色为不确定区域。结束前请<strong>导出全部标注 JSON</strong>；浏览器暂存不能替代导出。紫色 V4 补全参考默认关闭，不会自动写入标签。</p></header>
<div class="toolbar"><button id="prev">上一帧</button><select id="frame"></select><button id="next">下一帧</button><select id="view"><option value="manual">完整掩膜＋遮挡属性</option><option value="v4">V4 原始候选（只读）</option><option value="original">原图</option></select><label>缩放 <select id="zoom"><option value="0.75">75%</option><option value="1" selected>100%</option><option value="1.5">150%</option><option value="2">200%</option><option value="3">300%</option></select></label><label><input id="band" type="checkbox">黄色搜索带边界</label><label><input id="gaps" type="checkbox">紫色 V4 补全估计（不入标签）</label><label><input id="overlay" type="checkbox" checked>显示掩膜 <kbd>空格</kbd>临时隐藏</label></div>
<div class="toolbar"><select id="tool"><option value="paint">画完整绳子</option><option value="occluded">标记遮挡（绿色）</option><option value="visible">取消遮挡标记</option><option value="erase">擦除绳子</option><option value="uncertain">标记不确定</option></select><label>画笔直径 <input id="size" type="range" min="1" max="80" value="4"><span id="sizeText">4px</span></label><label>透明度 <input id="opacity" type="range" min="10" max="100" value="75"></label><button id="undo">撤销当前帧一步</button><button id="reset">恢复该帧已导入标注</button><button id="clear">清空该帧标记</button><label>审核 <select id="review"><option value="unreviewed">未审核</option><option value="partial">部分审核</option><option value="reviewed">已审核</option></select></label></div>
<div id="viewport"><canvas id="canvas" width="1280" height="720"></canvas></div>
<footer><div id="meta"></div><p id="status">加载中…</p><label>该帧备注（例如漏选、误选、搜索带偏移、无法确认）：</label><br><textarea id="notes"></textarea><div class="toolbar"><button id="export">导出全部标注 JSON</button><button id="png">导出当前完整掩膜 PNG</button><button id="unknownPng">导出当前遮挡掩膜 PNG</button><label>导入已保存 JSON <input id="import" type="file" accept=".json,application/json"></label></div><p>完整掩膜、遮挡属性和不确定区域独立保存；可见部分由它们直接计算。遮挡画笔可以调宽，只有与已画绳子相交的像素会被标记。手绘隐藏部分仍是估计。审核前请检查是否漏标遮挡；出屏或无法估计的部分请备注，不强行画到屏幕内部。</p></footer>

<script>__EDITOR_SCRIPT__</script></html>
