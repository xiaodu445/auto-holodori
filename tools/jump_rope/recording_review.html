<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>跳绳原始录像标注</title>
<style>body{margin:22px;background:#121925;color:#e9f1ff;font:15px system-ui}main{max-width:1200px;margin:auto}button,select,input{font:inherit;background:#24334b;color:inherit;border:1px solid #526781;border-radius:5px;padding:7px;margin:4px}button{cursor:pointer}canvas{width:100%;height:230px;background:#0c1220;touch-action:none;cursor:crosshair}img{width:min(100%,800px);display:block;margin:12px auto}audio{width:100%}small{color:#abc0db}.row{display:flex;align-items:center;flex-wrap:wrap}#regions button{display:block;text-align:left}input[type=number]{width:110px}#overview{height:60px}#status{min-height:24px;color:#ffd67f}</style>
<main><h1>原始录像逐帧标注</h1><small>拖动波形选择片段；拖动选区边缘裁剪。单击定位，滚轮缩放，Shift＋滚轮平移。← / → 逐源帧，空格播放／暂停，I / O 标记开始／结束（包含当前帧）。音频为增益后的试听副本，原文件保持不变。</small>
<div style="position:relative;max-width:1280px;margin:12px auto"><img id="frame" style="width:100%;margin:0"><canvas id="ropeCanvas" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;background:transparent"></canvas></div><div class="row"><button id="pointsToggle">开启绳点标注</button><button id="pointUndo">撤销本帧最后一点</button><button id="pointsClear">清空本帧绳点</button><small>只点真实可见绳子，从左向右；遮挡处跳过。区间标注可以先完成，绳点之后再补。</small></div><div class="row"><label>跳到帧<input id="frameNumber" type="number" min="0" value="0"></label><button id="goFrame">定位</button></div><div id="clock"></div><audio id="audio" controls src="analysis-mono.wav"></audio>
<div class="row"><button id="prev">上一帧 ←</button><button id="next">下一帧 →</button><button id="zoomIn">放大＋</button><button id="zoomOut">缩小－</button><button id="fit">显示全段</button><button id="center">定位播放头</button><select id="speed"><option value="1">1×</option><option value="0.75">0.75×</option><option value="0.5">0.5×</option></select></div>
<canvas id="overview" width="1200" height="60"></canvas><canvas id="wave" width="1200" height="230"></canvas>
<div class="row"><button id="markIn">I 标记开始</button><button id="markOut">O 标记结束</button><label>起点（采集秒）<input id="begin" type="number" step="0.001"></label><label>终点<input id="end" type="number" step="0.001"></label><button id="preview">试听选区</button><button id="clear">清除选区</button></div>
<div class="row"><label>阶段<select id="stage"><option value="">不确定</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><label>状态<select id="label"><option value="normal">正常</option><option value="accelerate">加速</option><option value="decelerate">减速</option><option value="low_swing">低空左右摇</option><option value="unknown">不确定</option></select></label><label>方向<select id="direction"><option value="forward">正摇</option><option value="reverse">反摇</option><option value="both">低空往返</option><option value="unknown">不确定</option></select></label><label>类型<select id="kind"><option value="stable">稳定段</option><option value="transition">切换段</option><option value="occlusion">遮挡段</option></select></label><input id="note" placeholder="圈数范围、遮挡或边界备注"><button id="save">保存区间</button><button id="export">导出标注JSON</button><label>导入JSON<input id="import" type="file" accept=".json"></label></div><div id="status"></div><div id="regions"></div><small>稳定段、切换段和遮挡段分开标。保存只写入浏览器缓存，最后必须导出JSON；可再导入继续标注。波形粒度约 2 毫秒，画面使用全部原始采集帧及时间戳，不按固定 60 FPS 推算。音画实际设备延迟尚未独立校准。</small></main>
<script>
const data=__DATA__, $=id=>document.getElementById(id), audio=$('audio'), canvas=$('wave'), ctx=canvas.getContext('2d');
let viewStart=0,viewEnd=data.duration,begin=null,end=null,frameOverride=0,currentIndex=0,drag=null,previewEnd=null,lastImage='',labels=[];
const key='jump-rope-recording-'+data.recording;let pointMarks={},pointMode=false;try{pointMarks=JSON.parse(localStorage.getItem(key+'-points')||'{}')}catch(e){}
try{labels=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){$('status').textContent='浏览器无法读取缓存；请使用导出保存。'}
function interpolate(value,from,to){let rows=data.audio_map,lo=0,hi=rows.length-1;while(lo<hi){let m=(lo+hi+1)>>1;if(rows[m][from]<=value)lo=m;else hi=m-1}let b=rows[Math.min(lo+1,rows.length-1)],a=rows[lo];return a[to]+(value-a[from])*(b[from]>a[from]?(b[to]-a[to])/(b[from]-a[from]):1)}
const mapped=w=>interpolate(w,'wav','t'),unmapped=t=>interpolate(t,'t','wav'),clamp=x=>Math.max(0,Math.min(data.duration,x));
function nearest(t){let lo=0,hi=data.frames.length-1;while(lo<hi){let m=(lo+hi)>>1;if(data.frames[m].time<t)lo=m+1;else hi=m}return lo>0&&Math.abs(data.frames[lo-1].time-t)<Math.abs(data.frames[lo].time-t)?lo-1:lo}
function seek(w){frameOverride=null;previewEnd=null;audio.pause();audio.currentTime=clamp(w);draw()}
function goFrame(i){i=Math.max(0,Math.min(data.frames.length-1,Math.round(i)));seek(unmapped(data.frames[i].time));frameOverride=i;draw()}
function step(n){goFrame(currentIndex+n)}
$('goFrame').onclick=()=>goFrame(Number($('frameNumber').value));
function bounds(a,b){let length=Math.min(data.duration,Math.max(.1,b-a));viewStart=Math.max(0,Math.min(data.duration-length,a));viewEnd=viewStart+length;draw()}
function zoom(f,anchor=audio.currentTime){let width=viewEnd-viewStart,pos=(anchor-viewStart)/width,newWidth=Math.min(data.duration,Math.max(.1,width*f));bounds(anchor-pos*newWidth,anchor+(1-pos)*newWidth)}
function waveform(c,a,b,overview=false){let g=c.getContext('2d'),W=c.width,H=c.height;g.clearRect(0,0,W,H);g.strokeStyle='#65b7d9';g.beginPath();for(let px=0;px<W;px++){let first=Math.floor((a+(b-a)*px/W)/data.peak_step),last=Math.ceil((a+(b-a)*(px+1)/W)/data.peak_step),min=0,max=0;for(let j=Math.max(0,first);j<Math.min(data.peaks.length,last);j++){min=Math.min(min,data.peaks[j][0]);max=Math.max(max,data.peaks[j][1])}g.moveTo(px,H*.52-max*H*.42);g.lineTo(px,H*.52-min*H*.42)}g.stroke();const x=w=>(w-a)/(b-a)*W;
if(begin!==null&&end!==null){let l=x(unmapped(Math.min(begin,end))),r=x(unmapped(Math.max(begin,end)));g.fillStyle='#61ca9944';g.fillRect(l,0,r-l,H);g.fillStyle='#82edb9';g.fillRect(l-2,0,4,H);g.fillRect(r-2,0,4,H)}
g.fillStyle='#ffcb6b';g.fillRect(x(audio.currentTime)-1,0,2,H);
if(overview){g.strokeStyle='#dceaff';g.strokeRect(x(viewStart),1,x(viewEnd)-x(viewStart),H-2)}else{let target=(b-a)/10,unit=Math.pow(10,Math.floor(Math.log10(target))),tick=[1,2,5,10].find(n=>n*unit>=target)*unit;g.fillStyle='#adc1db';g.font='12px system-ui';for(let t=Math.ceil(a/tick)*tick;t<=b;t+=tick){g.fillText(mapped(t).toFixed(tick<.1?3:2)+'s',x(t)+3,16);g.fillStyle='#abc0db22';g.fillRect(x(t),20,1,H-20);g.fillStyle='#adc1db'}let samples=data.frames.filter(f=>{let w=unmapped(f.time);return w>=a&&w<=b});if(samples.length<180){g.fillStyle='#97a9c5';for(let f of samples)g.fillRect(x(unmapped(f.time)),H-9,1,9)}}}
function draw(){let i=frameOverride??nearest(mapped(audio.currentTime)),f=data.frames[i];currentIndex=i;$('frameNumber').value=i;if(lastImage!==f.image){$('frame').src=f.image;lastImage=f.image}$('clock').textContent=`源帧 ${f.frame} / ${data.frames.length-1} · 采集时间 ${f.time.toFixed(6)} 秒 · 音频时间 ${audio.currentTime.toFixed(3)} 秒`;waveform(canvas,viewStart,viewEnd);waveform($('overview'),0,data.duration,true);paintPoints()}
function selection(){ $('begin').value=begin===null?'':begin.toFixed(3);$('end').value=end===null?'':end.toFixed(3);draw() }
function point(e,c=canvas){let rect=c.getBoundingClientRect();return clamp((e.clientX-rect.left)/rect.width*(viewEnd-viewStart)+viewStart)}
canvas.onpointerdown=e=>{audio.pause();frameOverride=null;previewEnd=null;let w=point(e),t=mapped(w),width=viewEnd-viewStart,edge=width*10/canvas.getBoundingClientRect().width;let mode=begin!==null&&Math.abs(w-unmapped(begin))<edge?'begin':end!==null&&Math.abs(w-unmapped(end))<edge?'end':'new';drag={mode,w,x:e.clientX,moved:false};canvas.setPointerCapture(e.pointerId);audio.currentTime=w;draw()};
canvas.onpointermove=e=>{if(!drag)return;let w=point(e),t=mapped(w);if(Math.abs(e.clientX-drag.x)>3)drag.moved=true;if(drag.mode==='begin')begin=t;else if(drag.mode==='end')end=t;else if(drag.moved){begin=mapped(Math.min(drag.w,w));end=mapped(Math.max(drag.w,w))}selection()};
canvas.onpointerup=()=>{if(begin!==null&&end!==null&&begin>end)[begin,end]=[end,begin];drag=null;selection()};canvas.onpointercancel=()=>{drag=null};
canvas.onwheel=e=>{e.preventDefault();if(e.shiftKey){let d=Math.sign(e.deltaY)*(viewEnd-viewStart)*.15;bounds(viewStart+d,viewEnd+d)}else zoom(e.deltaY>0?1.4:1/1.4,point(e))};
$('overview').onclick=e=>{let r=$('overview').getBoundingClientRect(),w=clamp((e.clientX-r.left)/r.width*data.duration),half=(viewEnd-viewStart)/2;bounds(w-half,w+half);seek(w)};
$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('zoomIn').onclick=()=>zoom(.5);$('zoomOut').onclick=()=>zoom(2);$('fit').onclick=()=>bounds(0,data.duration);$('center').onclick=()=>{let h=(viewEnd-viewStart)/2;bounds(audio.currentTime-h,audio.currentTime+h)};$('speed').onchange=()=>audio.playbackRate=+$('speed').value;
$('markIn').onclick=()=>{begin=data.frames[currentIndex].time;selection()};$('markOut').onclick=()=>{end=data.frames[currentIndex+1]?.time??data.recording_end;selection()};for(let id of ['begin','end'])$(id).onchange=()=>{let v=$(id).value===''?null:Number($(id).value);if(v!==null&&!Number.isFinite(v))return;if(id==='begin')begin=v;else end=v;selection()};
function valid(){return begin!==null&&end!==null&&end>begin&&begin>=data.frames[0].time&&end<=data.recording_end}
$('preview').onclick=()=>{if(!valid()){$('status').textContent='请标记有效的开始、结束帧，结束须晚于开始。';return}frameOverride=null;audio.currentTime=clamp(unmapped(begin));previewEnd=unmapped(end);audio.play().catch(e=>$('status').textContent=e.message)};
$('clear').onclick=()=>{begin=end=null;previewEnd=null;selection()};
function persist(){try{localStorage.setItem(key,JSON.stringify(labels))}catch(e){$('status').textContent='缓存不可写，请导出 JSON 保存。'}}
function renderLabels(){$('regions').replaceChildren();labels.forEach((l,i)=>{let row=document.createElement('div'),button=document.createElement('button'),del=document.createElement('button');button.textContent=`${i+1}. 阶段${l.stage??"?"} ${l.label}/${l.direction??"?"} ${l.kind??"?"} · 帧${l.start_frame??nearest(l.start)}–${l.end_frame_exclusive??nearest(l.end)}(结束帧不含) · ${l.start.toFixed(3)}–${l.end.toFixed(3)} 秒`;button.onclick=()=>{begin=l.start;end=l.end;$('label').value=l.label;$('stage').value=l.stage??'';$('direction').value=l.direction??'unknown';$('kind').value=l.kind??'stable';$('note').value=l.note??'';seek(unmapped(begin));bounds(unmapped(begin)-.5,unmapped(end)+.5);selection()};del.textContent='删除';del.onclick=()=>{labels.splice(i,1);persist();renderLabels()};row.className='row';row.append(button,del);$('regions').append(row)})}
$('save').onclick=()=>{if(!valid()){$('status').textContent='请标记有效的开始、结束帧，结束须晚于开始。';return}if($('stage').value==='1'&&($('label').value!=='normal'||$('direction').value!=='forward')){$('status').textContent='阶段1只有正摇正常档，请修正或将阶段设为不确定。';return}labels.push({start:begin,end: end,start_frame:nearest(begin),end_frame_exclusive:end>data.frames.at(-1).time?data.frames.length:nearest(end),stage:$('stage').value?Number($('stage').value):null,label:$('label').value,direction:$('direction').value,kind:$('kind').value,note:$('note').value,human_reviewed:$('label').value!=='unknown'&&$('direction').value!=='unknown'});persist();renderLabels();$('status').textContent='已保存确认片段，请最后导出 JSON。'};
$('export').onclick=()=>{let blob=new Blob([JSON.stringify({schema:1,recording:data.recording,frame_range_convention:"[start_frame,end_frame_exclusive)",time_reference:"timestamps.json",annotations:labels,frame_points:Object.entries(pointMarks).map(([frame,points])=>({frame:Number(frame),time:data.frames[Number(frame)].time,coordinate_space:"normalized_game_client",points}))},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='jump-rope-recording-annotations.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
document.onkeydown=e=>{if(['INPUT','SELECT','TEXTAREA','BUTTON','AUDIO'].includes(e.target.tagName))return;if(e.code==='ArrowLeft'){e.preventDefault();step(-1)}else if(e.code==='ArrowRight'){e.preventDefault();step(1)}else if(e.code==='Space'){e.preventDefault();frameOverride=null;previewEnd=null;if(audio.paused)audio.play();else audio.pause()}else if(e.code==='KeyI')$('markIn').click();else if(e.code==='KeyO')$('markOut').click()};
$('import').onchange=async()=>{try{let value=JSON.parse(await $('import').files[0].text());if(value.recording!==data.recording||!Array.isArray(value.annotations))throw Error('录制来源不一致');if(value.annotations.some(l=>!Number.isFinite(l.start)||!Number.isFinite(l.end)||l.start<0||l.end>data.recording_end||l.end<=l.start))throw Error('区间无效');let importedPoints={};for(let p of value.frame_points??[]){if(!Number.isInteger(p.frame)||p.frame<0||p.frame>=data.frames.length||!Array.isArray(p.points)||p.points.some(q=>q.length!==2||q.some(v=>!Number.isFinite(v)||v<0||v>1)))throw Error('绳点数据无效');importedPoints[p.frame]=p.points}labels=value.annotations;pointMarks=importedPoints;persistPoints();persist();renderLabels();paintPoints();$('status').textContent='已导入标注'}catch(e){$('status').textContent=e.message}};
function paintPoints(){let c=$('ropeCanvas'),im=$('frame');if(!im.naturalWidth)return;c.width=im.naturalWidth;c.height=im.naturalHeight;let g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);g.fillStyle='#00ff77';g.strokeStyle='#132b19';for(let [x,y] of pointMarks[currentIndex]??[]){g.beginPath();g.arc(x*c.width,y*c.height,5,0,Math.PI*2);g.fill();g.stroke()}}
function persistPoints(){try{localStorage.setItem(key+'-points',JSON.stringify(pointMarks))}catch(e){$('status').textContent='缓存不可写，请及时导出JSON'}}
$('frame').onload=paintPoints;$('pointsToggle').onclick=()=>{pointMode=!pointMode;$('ropeCanvas').style.pointerEvents=pointMode?'auto':'none';$('pointsToggle').textContent=pointMode?'关闭绳点标注':'开启绳点标注'};
$('ropeCanvas').onclick=e=>{audio.pause();let r=e.currentTarget.getBoundingClientRect();(pointMarks[currentIndex]??=[]).push([(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]);persistPoints();paintPoints()};
$('pointUndo').onclick=()=>{pointMarks[currentIndex]?.pop();persistPoints();paintPoints()};$('pointsClear').onclick=()=>{delete pointMarks[currentIndex];persistPoints();paintPoints()};
audio.onplay=()=>{frameOverride=null};
function tick(){if(previewEnd!==null&&audio.currentTime>=previewEnd){audio.pause();audio.currentTime=previewEnd;previewEnd=null}if(!audio.paused)draw();requestAnimationFrame(tick)}audio.onseeked=draw;audio.onloadedmetadata=draw;renderLabels();draw();tick();
</script></html>
